<!-- Fallback for every other 4xx status (401, 403, 405, 429, ...) -->
<include src="layout.html">
  <template name="head">
    <title th:text="|${error?.status ?: 400} - ${site.title}|">请求有误</title>
  </template>

  <div class="mdocs-container-page">
    <th:block
      th:with="status = ${error?.status ?: 400},
               detail = ${not #strings.isEmpty(error?.detail) ? error.detail : '这个请求无法被处理，请检查链接或访问权限后重试。'}"
    >
      <th:block
        th:replace="~{error-page :: errorPage(${status}, '请求无法完成', ${detail})}"
      ></th:block>
    </th:block>
  </div>
</include>
