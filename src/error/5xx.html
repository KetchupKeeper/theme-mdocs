<!-- Fallback for every other 5xx status (502, 503, 504, ...) -->
<include src="layout.html">
  <template name="head">
    <title th:text="|${error?.status ?: 500} - ${site.title}|">服务器错误</title>
  </template>

  <div class="mdocs-container-page">
    <th:block
      th:with="status = ${error?.status ?: 500},
               detail = ${not #strings.isEmpty(error?.detail) ? error.detail : '服务暂时不可用，请稍后重试。如果问题持续出现，请联系站点管理员。'}"
    >
      <th:block
        th:replace="~{error-page :: errorPage(${status}, '服务出了点问题', ${detail})}"
      ></th:block>
    </th:block>
  </div>
</include>
