<include src="layout.html">
  <template name="head">
    <title th:text="|标签 - ${site.title}|">标签</title>
  </template>

  <div class="mdocs-container-page page-wrap">
    <h1 class="page-title">标签</h1>
    <!-- `tags` is a plain list here (no pagination wrapper) -->
    <ul class="tag-list">
      <li th:each="tag : ${tags}">
        <a th:href="@{${tag.status.permalink}}" th:text="${tag.spec.displayName}" class="tag"></a>
      </li>
    </ul>
  </div>
</include>
